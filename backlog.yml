# backlog.yml — sumber data tunggal untuk setup-github.sh
# Sumber: PRD.md & Guide.md (1 Okt 2026), diselaraskan dengan SKPL Rev D (pembayaran DOKU). Ubah di sini, lalu jalankan ulang skrip (idempotent).
#
# Konvensi:
#   - Milestone repo = Iterasi XP (I1-I9) + "Fase Berikutnya".
#   - Milestone Charter (M3-M9) = field "Gerbang Charter" di GitHub Project + label gate:Mx.
#   - Story yang UI-nya dan Live-nya jatuh di iterasi berbeda dipecah jadi 2 issue (slices).
#   - Poin per irisan memakai rasio UI:Live = 40:60 dari poin story (kalibrasi ulang setelah I1).
#   - prio: M = Must, S = Should, C = Could.
#   - slices: t = UI | Live | Full, m = id milestone, p = poin, g = gerbang Charter, r = role (untuk Full).

repo: GarsRayy/Web-Lempers2026

project:
  title: "Lempers 2026 - XP Board"

# Penanggung jawab per role (username GitHub). Kosong = tidak di-assign (label role:xx tetap dipasang).
# Username harus kolaborator repo (sudah cocok dengan daftar Manage access). Ubah lalu jalankan:  ./setup-github.sh --only assign
assignees:
  fe: "7refisa"         # Refi Ikhsanti
  be: "GarsRayy"        # Garis Rayya Rabbani
  qa: "keiralakeisha"   # Keira Lakeisha Fachra Fuady
  pm: "choirunnisasy"   # Choirunnisa Syawaldina

milestones:
  - {id: I1, title: "I1 - Fondasi & Walking Skeleton", due: "2026-10-04", desc: "28 Sep-4 Okt. Situs ter-deploy otomatis, spike editor RTE, ERD final, pertanyaan terbuka blocker diputuskan."}
  - {id: I2, title: "I2 - FE Publik + Fondasi Data", due: "2026-10-11", desc: "5-11 Okt. Halaman publik dengan data dummy, editor artikel (UI), skema DB, CI lengkap."}
  - {id: I3, title: "I3 - FE Admin & Alur (M3)", due: "2026-10-18", desc: "12-18 Okt. Seluruh UI admin & alur pengguna (dummy). Gerbang Charter M3. Demo R1 ke mitra Jumat 16 Okt."}
  - {id: I4, title: "I4 - Backend Editorial", due: "2026-10-25", desc: "19-25 Okt. Alur editorial end-to-end dengan data nyata + RBAC server."}
  - {id: I5, title: "I5 - Publik Live + Mulai Produk (M4)", due: "2026-11-01", desc: "26 Okt-1 Nov. Situs publik memakai data nyata, fondasi modul produk. Gerbang Charter M4. Demo R2 Jumat 30 Okt."}
  - {id: I6, title: "I6 - Produk E2E + Dashboard (M5, M6)", due: "2026-11-08", desc: "2-8 Nov. Feature complete. Gerbang Charter M5 dan M6. Demo R3 Jumat 6 Nov. Feature freeze Minggu 8 Nov."}
  - {id: I7, title: "I7 - Internal Testing & Bug Fixing (M7)", due: "2026-11-15", desc: "9-15 Nov. Hardening, tanpa fitur baru. Gerbang Charter M7. Release candidate Minggu 15 Nov."}
  - {id: I8, title: "I8 - UAT (M8)", due: "2026-11-22", desc: "16-22 Nov. UAT bersama mitra dengan akun asli. Gerbang Charter M8."}
  - {id: I9, title: "I9 - Deployment & Handover (M9)", due: "2026-11-29", desc: "23-29 Nov. Go-live (target Rab 25 Nov), handover, sign-off Project Charter. Batas akhir proyek."}
  - {id: NEXT, title: "Fase Berikutnya", due: null, desc: "Di luar rilis pertama: fitur yang ditunda atau dipangkas."}

