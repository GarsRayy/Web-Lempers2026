  # irisan & peran
  - {name: "slice:ui", color: "a2eeef", desc: "Irisan UI dengan data dummy"}
  - {name: "slice:live", color: "7057ff", desc: "Irisan terhubung backend/data nyata"}
  - {name: "role:fe", color: "f9d0c4", desc: "Penanggung jawab utama: Front End"}
  - {name: "role:be", color: "c5def5", desc: "Penanggung jawab utama: Back End"}
  - {name: "role:qa", color: "bfd4f2", desc: "Penanggung jawab utama: QA"}
  - {name: "role:pm", color: "e99695", desc: "Penanggung jawab utama: PM"}
