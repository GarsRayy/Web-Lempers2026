# backlog.yml — sumber data untuk setup-github.sh
# Sumber: SKPL (GL01-SKPL Rev E) & Project Charter. Jadwal M1–M9 = Schedule Estimate Charter (tidak diubah); M10 = fase berikutnya.
# Di luar scope (sengaja tidak ada): pelaporan/aduan (SKPL-F-10), migrasi kode, migrasi artikel Medium, komentar publik, live chat.
# Tim 4 orang: PM, FE, BE, QA (tanpa role UI/UX). Beban rilis 1 dibagi rata: 16 issue & 43 poin per orang.
# Milestone: start & due (YYYY-MM-DD) dipakai untuk field tanggal di GitHub Project (Mulai/Tenggat). M10 tanpa tanggal.
# Skema entri: id, title, kind, prio (M/S/C), epic, story, notes, ac[], ref, labels[], slices[{t: UI|Live|Full, m, p, g, r}]

repo: GarsRayy/Web-Lempers2026

project:
  title: "Lempers 2026 - XP Board"

# Penanggung jawab per role (username GitHub). Kosong = tidak di-assign (label role:xx tetap dipasang).
# Username harus kolaborator repo (sudah cocok dengan daftar Manage access). Ubah lalu jalankan:  ./setup-github.sh --only assign
assignees:
