entries:
  # ===================== ENABLER & SPIKE =====================
  - id: TS-01
    kind: enabler
    epic: 0-fondasi
    prio: M
    title: "Setup repo Next.js + TypeScript, lint, preview deploy Vercel"
    ref: "Guide I1"
    notes: "Walking skeleton end-to-end."
    ac:
      - "Repo berjalan lokal dengan satu perintah"
      - "Setiap PR otomatis mendapat preview URL"
      - "Variabel lingkungan terdokumentasi di .env.example"
    slices: [{t: Full, m: I1, p: 3, g: M3, r: be}]

  - id: TS-02
    kind: enabler
    epic: 0-fondasi
    prio: M
    title: "Migrasi kode dari basis kode lama"
    ref: "SKPL 1.2, 2.3"
    notes: "Bergantung pada OQ-04 (repo/basis kode mana yang dimigrasi)."
    ac:
      - "Daftar item yang dimigrasi tertulis"
      - "Deployment dan konfigurasi domain tetap berjalan setelah migrasi"
    slices: [{t: Full, m: I1, p: 3, g: M3, r: be}]
    labels: ["blocked"]

  - id: TS-03
    kind: enabler
    epic: 0-fondasi
    prio: M
    title: "Design tokens & komponen dasar sesuai guideline visual"
    ref: "Charter (Notes)"
    notes: "Bergantung pada guideline visual dari Kepala Divisi Desain (OQ-09)."
    ac:
      - "Token warna/tipografi/spasi sesuai guideline visual mitra"
      - "Komponen dasar lolos di 360px dan 1024px"
    slices: [{t: Full, m: I1, p: 3, g: M3, r: fe}]

  - id: SP-01
    kind: spike
    epic: 0-fondasi
    prio: M
    title: "Spike Rich Text Editor di layar 360px"
    ref: "Charter risiko High"
    notes: "Memitigasi risiko High dari Charter sebelum CMS dibangun. Kandidat awal: Tiptap, Lexical."
    ac:
      - "Kesimpulan tertulis maksimal 1 halaman memilih editor"
      - "Uji lulus: mengetik, format teks, sisip gambar, tempel teks di 360px (Chrome Android dan Safari iOS) tanpa horizontal scroll"
    slices: [{t: Full, m: I1, p: 2, g: M3, r: fe}]

  - id: TS-04
    kind: enabler
    epic: 0-fondasi
    prio: M
    title: "Skema database dari ERD + migrasi + RLS + seed"
    ref: "SKPL D1-D4"
    notes: "Memerlukan ERD final (DOC-01). Tambahan di luar SKPL: slot_foto, log_aktivitas, laporan, serta data pembayaran DOKU dan log webhook (lihat OQ-01, OQ-05, OQ-11). Skema pesanan mengikuti SKPL Rev D (tanpa bukti_bayar manual)."
    ac:
      - "Migrasi bisa dijalankan ulang dari nol"
      - "RLS aktif pada tabel sensitif"
      - "Seed memuat 4 peran contoh"
      - "Indeks untuk pencarian berita dirancang"
    slices: [{t: Full, m: I2, p: 5, g: M4, r: be}]

  - id: TS-05
    kind: enabler
    epic: 0-fondasi
    prio: M
    title: "CI: lint, typecheck, test, build, E2E smoke, Lighthouse CI"
    ref: "Guide 8.3"
    ac:
      - "PR tidak bisa digabung bila lint/typecheck/test/build gagal"
      - "E2E smoke (Playwright) berjalan pada preview"
      - "Lighthouse CI melaporkan Performance dan Accessibility"
    slices: [{t: Full, m: I2, p: 3, g: M4, r: be}]

  - id: SP-02
    kind: spike
    epic: 0-fondasi
    prio: M
    title: "Spike kompresi gambar maksimal 500 KB (client vs server)"
    ref: "SKPL-NF-05"
    ac:
      - "Foto 5-10 MB menghasilkan maksimal 500 KB tanpa degradasi yang mengganggu"
      - "Keputusan lokasi kompresi (client/server) tertulis"
    slices: [{t: Full, m: I2, p: 2, g: M4, r: be}]

  - id: SP-03
    kind: spike
    epic: 0-fondasi
    prio: M
    title: "Spike provider email invoice (kuota, deliverability)"
    ref: "SKPL-F-09"
    notes: "Invoice dikirim otomatis dari handler webhook DOKU (US-21)."
    ac:
      - "Email uji sampai ke Gmail dan email kampus (bukan spam)"
      - "Kuota gratis mencukupi perkiraan volume pesanan"
    slices: [{t: Full, m: I5, p: 2, g: M5, r: be}]

  - id: SP-04
    kind: spike
    epic: 0-fondasi
    prio: M
    title: "Spike integrasi DOKU di sandbox (checkout, webhook, signature, idempotensi)"
    ref: "SKPL-F-08, SKPL-F-09"
    notes: "Memitigasi risiko integrasi payment gateway (SKPL Rev D) sebelum US-20/US-21 dibangun. Memakai akun DOKU Sandbox untuk simulasi pembayaran; akun produksi dibahas di OQ-12. Poin usulan, kalibrasi ulang di planning."
    ac:
      - "Sesi checkout berhasil dibuat dari server dan pemesan diarahkan ke halaman DOKU sandbox"
      - "Webhook uji diterima di URL preview Vercel dan tanda tangannya (signature) tervalidasi"
      - "Notifikasi ganda tidak menghasilkan efek ganda (idempoten)"
      - "Kesimpulan tertulis maksimal 1 halaman: alur, metode bayar yang diaktifkan, keterbatasan"
    slices: [{t: Full, m: I3, p: 2, g: M5, r: be}]

  # ===================== EPIC A - AKUN & RBAC =====================
  - id: US-01
    kind: story
    epic: A-akun
    prio: M
    title: "Login/logout admin"
    ref: "SKPL-F-01"
    story: "Sebagai Admin, saya ingin login/logout dengan email & kata sandi, agar dapat mengakses dashboard sesuai peran saya."
    ac:
      - "Kredensial valid masuk ke dashboard sesuai peran"
      - "Kredensial salah menampilkan pesan Bahasa Indonesia yang tidak membocorkan field mana yang salah"
      - "Sesi kedaluwarsa setelah masa inaktivitas (usulan 30 menit, ditetapkan tim)"
      - "Kata sandi disimpan sebagai hash (bcrypt/argon2)"
    slices: [{t: UI, m: I2, p: 1.2, g: M3}, {t: Live, m: I3, p: 1.8, g: M4}]

  - id: US-02
    kind: story
    epic: A-akun
    prio: M
    title: "Pembatasan rute & API sesuai 4 peran (RBAC)"
    ref: "SKPL-F-01"
    story: "Sebagai Sistem, saya ingin membatasi rute dan API sesuai peran, agar pengguna hanya mengakses fitur haknya."
    ac:
      - "Akses di luar hak ditolak (403/redirect) di sisi server, bukan sekadar menu disembunyikan"
      - "Admin Monitoring tidak bisa mengubah apa pun (diuji di level API)"
    slices: [{t: UI, m: I3, p: 2, g: M3}, {t: Live, m: I4, p: 3, g: M4}]

  - id: US-03
    kind: story
    epic: A-akun
    prio: M
    title: "Kelola akun pengguna (Super Admin)"
    ref: "SKPL-F-01"
    story: "Sebagai Super Admin, saya ingin membuat akun, mengubah peran, dan menonaktifkan akun, agar akses tim terkendali."
    ac:
      - "Super Admin dapat membuat akun, mengubah peran, menonaktifkan"
      - "Akun nonaktif tidak bisa login tetapi riwayatnya tetap"
      - "Komposisi 1/3/1/1 (total 6 akun) divalidasi"
    slices: [{t: UI, m: I3, p: 2, g: M3}, {t: Live, m: I4, p: 3, g: M4}]

  # ===================== EPIC B - PROFIL =====================
  - id: US-04
    kind: story
    epic: B-profil
    prio: M
    title: "Halaman profil UKM (publik)"
    ref: "SKPL-F-02"
    story: "Sebagai Pengunjung, saya ingin melihat profil UKM (visi-misi, sejarah, struktur, kode etik, foto, kontak), agar mengenal Lembaga Pers."
    ac:
      - "Menampilkan visi, misi, sejarah, struktur organisasi, foto kegiatan, kontak"
      - "Kode etik tampil bila terisi"
    slices: [{t: UI, m: I1, p: 1.2, g: M3}, {t: Live, m: I5, p: 1.8, g: M4}]

  - id: US-05
    kind: story
    epic: B-profil
    prio: M
    title: "Edit konten profil tanpa developer"
    ref: "SKPL-F-02"
    story: "Sebagai Admin Bidang/Super Admin, saya ingin mengedit konten profil sendiri, agar tidak bergantung pada developer."
    ac:
      - "Setiap bagian profil dapat diedit"
      - "Perubahan langsung tampil di halaman publik"
      - "updated_at dan updated_by tercatat"
      - "Foto kegiatan dikompres"
    slices: [{t: UI, m: I3, p: 2, g: M3}, {t: Live, m: I5, p: 3, g: M4}]

  # ===================== EPIC C - BERITA & CMS =====================
  - id: US-06
    kind: story
    epic: C-berita
    prio: M
    title: "Daftar dan detail berita (publik)"
    ref: "SKPL-F-05"
    story: "Sebagai Pengunjung, saya ingin membaca daftar dan detail berita terbit, agar mengikuti kabar kampus."
    ac:
      - "Hanya artikel berstatus Published yang tampil"
      - "Menampilkan judul, kategori, narator, kredit foto, tanggal"
      - "Tidak ada horizontal scroll di 360px"
    slices: [{t: UI, m: I2, p: 2, g: M3}, {t: Live, m: I5, p: 3, g: M4}]

  - id: US-07
    kind: story
    epic: C-berita
    prio: M
    title: "Pencarian dan filter kategori berita"
    ref: "SKPL-F-05"
    story: "Sebagai Pengunjung, saya ingin mencari kata kunci dan memfilter kategori, agar cepat menemukan berita."
    ac:
      - "Pencarian pada judul/isi"
      - "Filter 4 kategori (Kebijakan Kampus, Isu Sosial, Organisasi, Akademik)"
      - "Hasil kosong menampilkan pesan"
      - "Kueri didukung indeks DB"
    slices: [{t: UI, m: I2, p: 1.2, g: M3}, {t: Live, m: I5, p: 1.8, g: M4}]

  - id: US-08
    kind: story
    epic: C-berita
    prio: M
    title: "Menulis draf berita (RTE, media, kategori, narator & kredit foto)"
    ref: "SKPL-F-03"
    story: "Sebagai Admin Bidang, saya ingin menulis draf berita dengan rich text editor, agar bisa menyusun artikel lengkap."
    notes: "Bergantung pada hasil SP-01 (pilihan editor)."
    ac:
      - "Judul, isi, kategori (4), narator, dan kredit foto wajib diisi (validasi)"
      - "Gambar utama dan sisip gambar (terkompresi)"
      - "Format teks dasar tersedia"
      - "Nyaman diketik di layar 360px"
    slices: [{t: UI, m: I2, p: 3.2, g: M3}, {t: Live, m: I4, p: 4.8, g: M4}]

  - id: US-09
    kind: story
    epic: C-berita
    prio: M
    title: "Autosave draf"
    ref: "SKPL-F-03, SKPL-NF-02"
    story: "Sebagai Admin Bidang, saya ingin draf tersimpan otomatis, agar tulisan tidak hilang saat koneksi bermasalah."
    ac:
      - "Draf tersimpan otomatis setiap 30-60 detik bila ada perubahan"
      - "Ada indikator 'tersimpan'"
      - "Jika gagal, tampil peringatan dan dicoba ulang"
      - "Isi tidak hilang setelah refresh"
    slices: [{t: UI, m: I2, p: 1.2, g: M3}, {t: Live, m: I4, p: 1.8, g: M4}]

  - id: US-10
    kind: story
    epic: C-berita
    prio: M
    title: "Ajukan draf & lihat status"
    ref: "SKPL-F-04"
    story: "Sebagai Admin Bidang, saya ingin mengajukan draf ke Super Admin dan melihat statusnya, agar alur terbit jelas."
    ac:
      - "Tombol 'Ajukan' mengubah Draft/Rejected menjadi Pending Approval"
      - "Admin Bidang tidak dapat menerbitkan langsung"
      - "Status draf terlihat jelas"
    slices: [{t: UI, m: I3, p: 1.2, g: M3}, {t: Live, m: I4, p: 1.8, g: M4}]

  - id: US-11
    kind: story
    epic: C-berita
    prio: M
    title: "Approve/reject artikel (Super Admin) - state machine editorial"
    ref: "SKPL-F-04"
    story: "Sebagai Super Admin, saya ingin menyetujui (otomatis terbit) atau menolak artikel, agar hanya konten layak yang tayang."
    notes: "Risiko High (Charter). Kerjakan dengan TDD dan berpasangan dengan QA."
    ac:
      - "Super Admin melihat antrean Pending Approval"
      - "Approve mengubah status ke Published (published_at dan approved_by terisi)"
      - "Reject mengubah status ke Rejected (+ catatan, lihat OQ-07)"
      - "Transisi di luar state machine ditolak server"
      - "Test mencakup semua transisi valid dan invalid; tidak ada jalur terbit tanpa approval"
    slices: [{t: UI, m: I3, p: 2, g: M3}, {t: Live, m: I4, p: 3, g: M4}]

  - id: US-12
    kind: story
    epic: C-berita
    prio: M
    title: "Penanda status artikel (antrean pending, catatan penolakan)"
    ref: "SKPL-F-04"
    story: "Sebagai Admin Bidang/Super Admin, saya ingin melihat penanda status, agar artikel tidak tertahan tanpa notifikasi."
    ac:
      - "Admin Bidang melihat status dan catatan penolakan"
      - "Super Admin melihat jumlah artikel menunggu persetujuan"
      - "Versi minimal: indikator di dashboard; notifikasi email opsional"
    slices: [{t: Full, m: I4, p: 3, g: M4, r: be}]

  - id: US-13
    kind: story
    epic: C-berita
    prio: M
    title: "Kompresi otomatis semua gambar unggahan (maksimal 500 KB)"
    ref: "SKPL-NF-05"
    story: "Sebagai Sistem, saya ingin mengompres semua gambar unggahan, agar kuota storage hemat dan halaman cepat."
    ac:
      - "Semua unggahan gambar (artikel, profil, produk) maksimal 500 KB"
      - "Hanya format gambar yang diizinkan"
      - "File tidak valid atau terlalu besar ditolak dengan pesan jelas"
    slices: [{t: Full, m: I4, p: 3, g: M6, r: be}]

  - id: US-14
    kind: story
    epic: C-berita
    prio: S
    title: "Berbagi artikel ke WhatsApp & Instagram"
    ref: "SKPL-F-12"
    story: "Sebagai Pengunjung, saya ingin membagikan artikel ke WhatsApp dan Instagram, agar berita menjangkau lebih luas."
    notes: "Instagram tidak punya URL berbagi web resmi; usulan Web Share API di mobile + tombol 'Salin tautan' (OQ-08)."
    ac:
      - "Tombol WhatsApp membuka tautan berbagi berisi judul + URL"
      - "Tombol Instagram memakai Web Share API / salin tautan"
      - "Tombol hanya muncul di halaman artikel"
    slices: [{t: UI, m: I2, p: 0.8, g: M3}, {t: Live, m: I6, p: 1.2, g: M6}]

  # ===================== EPIC D - PRODUK & PEMESANAN =====================
  - id: US-15
    kind: story
    epic: D-produk
    prio: M
    title: "Katalog merchandise & paket foto studio (publik)"
    ref: "SKPL-F-06"
    story: "Sebagai Pengunjung, saya ingin melihat katalog merchandise dan paket foto studio, agar tahu produk yang tersedia."
    ac:
      - "Hanya produk berstatus Aktif yang tampil"
