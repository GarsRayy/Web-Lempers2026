  - {name: "gate:M3", color: "006b75", desc: "Charter M3 - Front End selesai (18 Okt)"}
  - {name: "gate:M4", color: "006b75", desc: "Charter M4 - Backend & Integrasi selesai (1 Nov)"}
  - {name: "gate:M5", color: "006b75", desc: "Charter M5 - Fitur Produk Mitra selesai (8 Nov)"}
  - {name: "gate:M6", color: "006b75", desc: "Charter M6 - Dashboard & Fitur Pendukung selesai (8 Nov)"}
