  - {name: "type:enabler", color: "5319e7", desc: "Pekerjaan teknis fondasi"}
  - {name: "type:spike", color: "d4c5f9", desc: "Riset/uji kelayakan berbatas waktu"}
  - {name: "type:decision", color: "fbca04", desc: "Pertanyaan terbuka yang perlu diputuskan"}
  - {name: "type:doc", color: "0e8a16", desc: "Dokumen/deliverable akademik"}
  - {name: "type:qa", color: "bfdadc", desc: "Aktivitas pengujian"}
  - {name: "type:uat", color: "c2e0c6", desc: "Aktivitas UAT bersama mitra"}
  - {name: "type:release", color: "006b75", desc: "Deployment & handover"}
  - {name: "type:backlog", color: "ededed", desc: "Ditunda ke fase berikutnya"}
