  # ===================== PERTANYAAN TERBUKA (OQ) =====================
  - id: OQ-01
    kind: decision
    title: "Aduan: form internal atau tautan eksternal?"
    labels: ["needs-decision"]
    notes: |
      **Masalah:** SKPL-F-10 menyebut tautan ke formulir eksternal, sedangkan Lingkup Masalah/Charter menyebut formulir internal di web, dan dashboard memerlukan 'total laporan masuk'.

      **Asumsi kerja:** form internal tersimpan di DB (tabel laporan). Jika eksternal, definisikan ulang metrik dashboard.

      **Putuskan sebelum:** 5 Okt (UI I2). **Dampak:** US-23, US-25.
    slices: [{t: Full, m: I1, r: pm}]

  - id: OQ-02
    kind: decision
    title: "Konfirmasi pembayaran: payment gateway DOKU (SKPL Rev D) menggantikan QRIS statis"
    labels: ["needs-decision"]
    notes: |
      **Masalah:** PRD dan Guide versi 1 Okt masih menulis QRIS statis + verifikasi manual (bersumber dari SKPL Rev C), sedangkan SKPL Rev D dan Charter memakai payment gateway DOKU dengan verifikasi webhook otomatis.

      **Asumsi kerja:** DOKU, mengikuti SKPL Rev D. Backlog ini sudah disesuaikan.

      **Putuskan sebelum:** 5 Okt. **Dampak:** US-20, US-21, TS-04, DOC-03, OQ-12.
    ac:
      - "PIC mitra dan dosen mengonfirmasi DOKU sebagai metode pembayaran"
      - "Keputusan dicatat di log keputusan (Guide 13)"
    slices: [{t: Full, m: I1, r: pm}]

  - id: OQ-03
    kind: decision
    title: "Target Lighthouse: Charter vs SKPL"
    labels: ["needs-decision"]
    notes: |
      **Masalah:** Charter menargetkan Performance > 80 dan Accessibility > 90; SKPL menyebut 75-80 dan 85-90.

      **Asumsi kerja:** target = Charter; SKPL = batas minimum.

      **Putuskan sebelum:** 12 Okt.
    slices: [{t: Full, m: I2, r: pm}]

  - id: OQ-04
    kind: decision
    title: "Basis kode lama: repo apa, apa yang dipertahankan, domain sudah ada?"
    labels: ["needs-decision"]
    notes: |
      **Masalah:** SKPL menyebut migrasi kode dari basis kode lama demi konsistensi deployment dan domain, tetapi Charter menganggarkan pembelian domain baru.

      **Asumsi kerja:** identifikasi di I1.

      **Putuskan sebelum:** 2 Okt. **Dampak:** TS-02.
    slices: [{t: Full, m: I1, r: be}]

  - id: OQ-05
    kind: decision
    title: "Data pesanan kurang & aturan slot foto"
    labels: ["needs-decision"]
    notes: |
      **Masalah:** data pesanan di SKPL tidak memuat jumlah, total harga, kode pesanan; aturan slot (jam operasional, durasi, kapasitas) belum ada.

      **Asumsi kerja:** tambah jumlah, total, kode_pesanan, dan tabel slot_foto.

      **Putuskan sebelum:** 12 Okt. **Dampak:** TS-04, US-17, US-18, US-19.
    slices: [{t: Full, m: I2, r: pm}]

  - id: OQ-06
    kind: decision
    title: "Format invoice (nomor, logo, alamat pengirim)"
    labels: ["needs-decision"]
    notes: |
      **Asumsi kerja:** template sederhana; konfirmasi desain dengan mitra.

      **Putuskan sebelum:** 25 Okt. **Dampak:** US-21.
    slices: [{t: Full, m: I4, r: pm}]

  - id: OQ-07
    kind: decision
    title: "Aturan hak akses implisit (kepemilikan draf, catatan penolakan, Super Admin di produk)"
    labels: ["needs-decision"]
    notes: |
      **Masalah:** (a) apakah Admin Bidang hanya mengedit draf miliknya, (b) apakah penolakan wajib disertai catatan, (c) apakah Super Admin ikut mengelola produk/pesanan.

      **Asumsi kerja:** (a) ya, (b) ya, (c) ya.

      **Putuskan sebelum:** 12 Okt. **Dampak:** US-02, US-11.
    slices: [{t: Full, m: I2, r: pm}]

  - id: OQ-08
    kind: decision
    title: "Mekanisme berbagi ke Instagram"
    labels: ["needs-decision"]
    notes: |
      **Masalah:** Instagram tidak punya URL berbagi web resmi.

      **Asumsi kerja:** Web Share API (mobile) + tombol salin tautan.

      **Putuskan sebelum:** 5 Okt (UI I2). **Dampak:** US-14.
    slices: [{t: Full, m: I1, r: pm}]

  - id: OQ-09
    kind: decision
    title: "Guideline visual dari Kepala Divisi Desain sudah diterima?"
    labels: ["needs-decision"]
    notes: |
      **Masalah:** Charter menetapkan konfirmasi guideline visual (warna, tipografi, logo) paling lambat akhir Minggu 2 (+-20 Sep).

      **Asumsi kerja:** bila belum, TS-03 menjadi blocker.

      **Putuskan sebelum:** 2 Okt.
    slices: [{t: Full, m: I1, r: pm}]

  - id: OQ-10
    kind: decision
    title: "Hosting gratis vs berbayar (Vercel Hobby, Supabase free) dan anggaran"
    labels: ["needs-decision"]
    notes: |
      **Masalah:** Vercel Hobby dibatasi untuk penggunaan non-komersial (situs ini menjual produk/jasa), dan proyek Supabase free tier otomatis pause setelah sekitar 1 minggu tanpa aktivitas. Anggaran total Charter Rp 1.000.000.

      **Asumsi kerja:** mulai dengan free tier + mitigasi (keep-alive, prosedur pemulihan); konfirmasi ke Vercel Support; putuskan sebelum I9.

      **Putuskan sebelum:** 8 Nov. **Dampak:** US-30, US-29.
    slices: [{t: Full, m: I6, r: pm}]

  - id: OQ-11
    kind: decision
    title: "Urutan reservasi foto studio: bayar dulu atau konfirmasi jadwal dulu? Berapa lama slot ditahan?"
    labels: ["needs-decision"]
    notes: |
      **Masalah:** SKPL Rev D menyebut Admin Produk mengonfirmasi request jadwal foto, sedangkan pembayaran kini otomatis lewat DOKU. Belum jelas apakah pemesan membayar sebelum atau sesudah jadwal dikonfirmasi, dan apa yang terjadi pada slot selama pembayaran berlangsung.

      **Asumsi kerja:** pemesan memilih slot, slot ditahan sementara, pemesan membayar, lalu Admin Produk mengonfirmasi jadwal; slot dilepas bila pembayaran gagal atau kedaluwarsa. Lama penahanan ditetapkan tim bersama mitra.

      **Putuskan sebelum:** 12 Okt. **Dampak:** US-17, US-19, US-21.
    slices: [{t: Full, m: I2, r: pm}]

  - id: OQ-12
    kind: decision
    title: "Akun merchant DOKU produksi: pemilik, dokumen, biaya transaksi, dan anggaran"
    labels: ["needs-decision"]
    notes: |
      **Masalah:** akun DOKU Sandbox cukup untuk uji, tetapi transaksi nyata memakai akun DOKU Business yang umumnya melalui proses verifikasi dan dokumen bisnis (periksa syarat terbaru langsung ke DOKU). Belum jelas atas nama siapa akun dibuat (UKM, ITERA, atau perorangan), dokumen apa yang tersedia, siapa menanggung biaya transaksi, dan berapa lama persetujuannya. Anggaran Charter hanya Rp 1.000.000.

      **Asumsi kerja:** kembangkan dan UAT memakai sandbox; ajukan akun produksi sedini mungkin karena waktu persetujuan di luar kendali tim.

      **Putuskan sebelum:** 12 Okt. **Dampak:** US-20, US-21, REL-01, OQ-10.
    slices: [{t: Full, m: I2, r: pm}]

