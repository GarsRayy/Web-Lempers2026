milestones:
  - { id: M1, start: "2026-09-07", title: "I1 — Perencanaan Proyek Selesai", due: "2026-10-04", desc: "Charter final (scope, tim, milestone), disetujui PM dan dikonfirmasi ke mitra." }
  - { id: M2, start: "2026-10-05", title: "I2 — Analisis dan Desain Disetujui", due: "2026-10-11", desc: "Analisis kebutuhan, wireframe/desain UI seluruh halaman, dan skema database (termasuk state machine editorial) final." }
  - { id: M3, start: "2026-10-12", title: "I3 — Front End Selesai", due: "2026-10-18", desc: "Seluruh komponen FE & user flow siap dengan data dummy, bisa didemokan di 360px dan 1024px." }
  - { id: M4, start: "2026-10-12", title: "I4 — Backend & Integrasi Selesai", due: "2026-11-01", desc: "Backend, autentikasi, RBAC 4 role, dan alur editorial terhubung ke FE lewat API." }
  - { id: M5, start: "2026-10-26", title: "I5 — Fitur Produk Mitra Selesai", due: "2026-11-08", desc: "Katalog, pemesanan, checkout & webhook DOKU aktif end-to-end; pesanan lunas otomatis." }
  - { id: M6, start: "2026-10-26", title: "I6 — Dashboard Analitik & Fitur Pendukung Selesai", due: "2026-11-08", desc: "Dashboard, search & filter, tombol share, dan kompresi gambar terintegrasi penuh." }
  - { id: M7, start: "2026-11-09", title: "I7 — Internal Testing & Bug Fixing Selesai", due: "2026-11-15", desc: "Tidak ada bug kritikal; Lighthouse Performance > 80 dan Accessibility > 90." }
  - { id: M8, start: "2026-11-16", title: "I8 — User Acceptance Test (UAT) Selesai", due: "2026-11-22", desc: "Mitra menguji dengan akun asli tiap role; disetujui PIC lewat form UAT sign-off." }
  - { id: M9, start: "2026-11-23", title: "I9 — Deployment & Handover Selesai", due: "2026-11-29", desc: "Website live di Vercel, dokumentasi handover diserahkan, sign-off Charter ditandatangani." }
  - { id: M10, title: "Fase Berikutnya (di luar rilis pertama)", desc: "Fitur ditunda/dipangkas dari rilis 1; dikerjakan hanya bila waktu masih ada setelah M9." }

entries:

  # ---------- M1 — Perencanaan ----------
  - id: P-01
    title: "Rapat kick-off & koordinasi internal tim"
    kind: task
    prio: M
    epic: proyek
    ref: "Charter 1.1"
    notes: "Charter 1.1. Tim 4 orang (PM, FE, BE, QA) tanpa role UI/UX: desain UI dikerjakan bersama FE & PM."
    ac:
      - "Pembagian peran & beban kerja disepakati semua anggota"
      - "Kanal komunikasi dan jadwal rapat rutin ditetapkan"
    slices:
      - { t: Full, m: M1, p: 1, g: M1, r: pm }
  - id: P-02
    title: "Finalisasi Project Charter & konfirmasi ke mitra"
    kind: docs
    prio: M
    epic: proyek
    ref: "Charter Milestone 1"
    ac:
      - "Charter final memuat scope, tim, milestone, risiko, biaya, dan jadwal"
      - "Disetujui Project Manager dan dikonfirmasi ke UKM Lembaga Pers ITERA"
    slices:
      - { t: Full, m: M1, p: 2, g: M1, r: pm }
  - id: P-03
    title: "Wawancara & observasi kebutuhan mitra"
    kind: task
    prio: M
    epic: proyek
    ref: "Charter 2.1 · SKPL 1.5"
    notes: "Sudah dilaksanakan 14 Sep 2026 di Sekretariat UKM Lembaga Pers (Student Center ITERA) bersama Arvel Alyagin & Nahli Saud Ramdani. Boleh langsung ditutup bila bukti sudah ada."
    ac:
      - "Formulir wawancara (PTI-01/2026) terdokumentasi"
      - "Kebutuhan mitra tercatat sebagai dasar SKPL"
    slices:
      - { t: Full, m: M1, p: 2, g: M1, r: qa }
  - id: P-04
    title: "Setup repository GitHub, label, milestone & Project board"
    kind: task
    prio: M
    epic: proyek
    ref: "Charter Milestone 1"
    ac:
      - "Repo, branch strategy, dan aturan PR siap"
      - "Label, milestone M1–M10, issue, dan Project dibuat lewat setup-github.sh"
      - "Keempat anggota menjadi kolaborator repo"
    slices:
      - { t: Full, m: M1, p: 1, g: M1, r: be }
  - id: P-05
    title: "Konfirmasi guideline visual (warna, tipografi, logo resmi) ke mitra"
    kind: task
    prio: M
    epic: proyek
    ref: "Charter Notes"
    notes: "Charter Notes: dikonfirmasi ke Kepala Divisi Desain Lembaga Pers paling lambat akhir Minggu 2."
    ac:
      - "Palet warna, tipografi, dan logo resmi diterima dari mitra"
      - "Aset disimpan di folder aset repo"
    slices:
      - { t: Full, m: M1, p: 1, g: M1, r: fe }

  # ---------- M2 — Analisis & Desain ----------
  - id: P-06
    title: "Finalisasi SKPL (revisi F) selaras dengan scope Charter"
    kind: docs
    prio: M
    epic: proyek
    ref: "SKPL Rev E→F · Charter Milestone 2"
    notes: "Selaraskan SKPL dengan Charter dan keputusan tim: hapus F-10 (pelaporan/aduan) dan semua rujukan migrasi kode; pembayaran lewat DOKU (bukan QRIS statis / bukti transfer); target Lighthouse mengikuti Charter (Performance > 80, Accessibility > 90)."
    ac:
      - "Tidak ada lagi rujukan pelaporan/aduan dan migrasi kode di SKPL"
      - "DFD, P-SPEC, dan tabel kerunutan konsisten dengan scope final"
      - "Disetujui Project Manager"
    slices:
      - { t: Full, m: M2, p: 3, g: M2, r: qa }
  - id: P-07
    title: "Wireframe & desain UI halaman publik"
    kind: task
    prio: M
    epic: proyek
    ref: "Charter Milestone 2 · SKPL 3.1.1"
    ac:
      - "Beranda, profil, daftar & detail berita, katalog, form pemesanan, status pesanan"
      - "Mobile-first untuk 360px dan 1024px"
      - "Mengikuti guideline visual mitra"
    slices:
      - { t: Full, m: M2, p: 3, g: M2, r: fe }
  - id: P-08
    title: "Wireframe & desain UI panel admin"
    kind: task
    prio: M
    epic: proyek
    ref: "Charter Milestone 2 · SKPL 3.1.1"
    ac:
      - "Login, editor CMS, antrean approval, kelola profil & akun, katalog admin, pesanan, dashboard"
      - "Mobile-first untuk 360px dan 1024px"
    slices:
      - { t: Full, m: M2, p: 3, g: M2, r: pm }
  - id: P-09
    title: "Aset visual & komponen UI dasar (icon, tipografi, asset kit)"
    kind: task
    prio: S
    epic: proyek
    ref: "Charter 3.1"
    ac:
      - "Asset kit dan komponen dasar siap dipakai di seluruh halaman"
    slices:
      - { t: Full, m: M2, p: 2, g: M2, r: fe }
  - id: P-10
    title: "Desain skema database & state machine editorial (ERD final)"
    kind: task
    prio: M
    epic: platform
    ref: "SKPL 3.2.5 & 3.3 · Charter Milestone 2"
    labels: ["risk"]
    ac:
      - "Entitas PENGGUNA, PROFIL_ORGANISASI, ARTIKEL, KATALOG_PRODUK, PESANAN, plus tabel log aktivitas untuk dashboard"
      - "State machine artikel: DRAFT → PENDING_APPROVAL → PUBLISHED / REJECTED"
      - "Indeks untuk pencarian & filter kategori artikel"
      - "Skema PostgreSQL (Supabase) siap diterapkan"
    slices:
      - { t: Full, m: M2, p: 3, g: M2, r: be }
  - id: P-11
    title: "Kontrak API REST (JSON) untuk UI dummy & integrasi"
    kind: task
    prio: M
    epic: platform
    ref: "SKPL 3.1.4"
    ac:
      - "Daftar endpoint, request/response JSON, dan kode galat didokumentasikan"
      - "FE dan BE sepakat kontrak sebelum M3 dimulai"
    slices:
      - { t: Full, m: M2, p: 2, g: M2, r: be }
  - id: P-12
    title: "Spike: pilih & validasi Rich Text Editor di layar 360px"
    kind: task
    prio: M
    epic: berita
    ref: "Charter Risiko · SKPL 3.5 poin 5"
    labels: ["risk"]
    notes: "Risiko High di Charter: editor yang tidak nyaman di HP menghambat Admin Bidang menulis berita."
    ac:
      - "Library RTE terpilih setelah dicoba di ponsel (360px)"
      - "Mendukung format teks dan unggah gambar"
    slices:
      - { t: Full, m: M2, p: 2, g: M2, r: fe }
  - id: P-13
    title: "Rencana pengujian & skenario uji dari SKPL"
    kind: test
    prio: M
    epic: mutu
    ref: "SKPL 3.7"
    ac:
      - "Setiap SKPL-F dan SKPL-NF punya minimal satu skenario uji"
      - "Skenario uji dapat dirunut ke ID kebutuhan"
    slices:
      - { t: Full, m: M2, p: 2, g: M2, r: qa }
  - id: P-14
    title: "Inisialisasi proyek Next.js, Supabase & preview Vercel"
    kind: task
    prio: M
    epic: platform
    ref: "SKPL 2.4 & 3.5"
    ac:
      - "Struktur proyek Next.js siap dan terhubung ke Supabase"
      - "Preview deployment Vercel aktif untuk setiap PR"
    slices:
      - { t: Full, m: M2, p: 2, g: M2, r: be }

  # ---------- FITUR — UI di M3, Live di M4/M5/M6 ----------
  - id: F-01a
    title: "Autentikasi & otorisasi akun (RBAC 4 role)"
    kind: feature
    prio: M
    epic: auth
    ref: "SKPL-F-01 · SKPL-NF-08 · SKPL 3.2.4.2.1"
    story: "Sebagai pengelola, saya ingin login dengan email dan kata sandi agar hanya menu sesuai role saya yang bisa diakses."
    notes: "4 role: Super Admin (1), Admin Bidang (3), Admin Monitoring (1), Admin Produk (1) = 6 akun. UI: halaman login + kerangka dashboard per role (dummy). Live: hash kata sandi, sesi, middleware RBAC, seed 6 akun."
    ac:
      - "Field kosong → \"Field tidak boleh kosong\"; email tak ada → \"Akun tidak ditemukan\"; sandi salah → \"Kata sandi salah\""
      - "Kata sandi di-hash (bcrypt/argon2) dan sesi kedaluwarsa setelah tidak aktif"
      - "Setelah login diarahkan ke dashboard sesuai role; akses lintas role ditolak"
      - "Tampil benar di 360px dan 1024px tanpa horizontal scroll"
    slices:
      - { t: UI, m: M3, p: 2, g: M3, r: fe }
      - { t: Live, m: M4, p: 4, g: M4, r: be }
  - id: F-01b
    title: "Kelola akun pengguna (Super Admin)"
    kind: feature
    prio: M
    epic: auth
    ref: "SKPL-F-01 · DFD 1.2"
    story: "Sebagai Super Admin, saya ingin menambah, mengubah, dan menonaktifkan akun pengelola agar hak akses tetap terkendali."
    notes: "Akun tidak dihapus permanen, hanya dinonaktifkan agar riwayat aktivitas tetap bisa ditelusuri (SKPL 3.3). Total akun pengelola maksimal 6."
    ac:
      - "Super Admin dapat membuat akun dan menetapkan role"
      - "Akun dapat dinonaktifkan/diaktifkan (status_aktif)"
      - "Role lain tidak bisa membuka halaman ini"
    slices:
      - { t: UI, m: M3, p: 2, g: M3, r: pm }
      - { t: Live, m: M4, p: 3, g: M4, r: be }
  - id: F-02
    title: "Pengelolaan konten profil organisasi"
    kind: feature
    prio: M
    epic: profil
    ref: "SKPL-F-02 · SKPL 3.2.4.2.2"
    story: "Sebagai Super Admin, saya ingin mengubah visi-misi, sejarah, struktur, foto kegiatan, kode etik, dan kontak sendiri agar tidak perlu developer."
    notes: "UI: halaman profil publik + form edit admin. Live: simpan ke DB dengan updated_at & updated_by, unggah foto ke storage."
    ac:
      - "Seluruh konten profil dapat diubah dari admin tanpa developer"
      - "Field wajib kosong → pesan galat dan tidak tersimpan"
      - "Berhasil → \"Profil berhasil diperbarui\" dan tampil di halaman publik"
    slices:
      - { t: UI, m: M3, p: 3, g: M3, r: pm }
      - { t: Live, m: M4, p: 3, g: M4, r: fe }
  - id: F-03
    title: "Penulisan draf berita (CMS)"
    kind: feature
    prio: M
    epic: berita
    ref: "SKPL-F-03 · SKPL-NF-02"
    labels: ["risk"]
    story: "Sebagai Admin Bidang, saya ingin menulis artikel dengan rich text editor dan menyimpannya otomatis agar tulisan tidak hilang."
    notes: "UI: editor (dummy), dropdown 4 rubrik, kredit foto, narator, indikator autosave. Live: CRUD artikel status DRAFT, unggah gambar, autosave 30–60 detik. Risiko Charter: autosave bergantung koneksi kampus."
    ac:
      - "Rubrik: Kebijakan Kampus, Isu Sosial, Organisasi, Akademik"
      - "Kredit foto dan narator wajib diisi sebelum diajukan"
      - "Autosave berkala 30–60 detik menyimpan ke status Draft"
      - "Editor nyaman dipakai di layar 360px"
    slices:
      - { t: UI, m: M3, p: 5, g: M3, r: pm }
      - { t: Live, m: M4, p: 5, g: M4, r: fe }
  - id: F-04
    title: "Alur persetujuan editorial (Draft → Pending Approval → Published)"
    kind: feature
    prio: M
    epic: berita
    ref: "SKPL-F-04 · SKPL 3.2.4.2.3"
    labels: ["risk"]
    story: "Sebagai Super Admin, saya ingin meninjau artikel yang diajukan lalu menyetujui atau menolaknya agar tidak ada artikel tayang tanpa approval."
    notes: "UI: antrean Pending Approval, detail artikel, tombol Setujui/Tolak. Live: state machine di server; approve otomatis menjadi Published; reject → Rejected dan bisa disunting ulang. Notifikasi dibuat sederhana di dalam sistem (daftar/badge berbasis status), tanpa tabel baru. Risiko High di Charter."
    ac:
      - "Admin Bidang hanya bisa Draft → Pending Approval, tidak bisa menerbitkan langsung"
      - "Hanya Super Admin yang bisa approve/reject; approve langsung Published dan tayang di publik"
      - "Transisi status yang tidak sah ditolak server"
      - "Super Admin melihat antrean artikel Pending; Admin Bidang melihat status Published/Rejected"
    slices:
      - { t: UI, m: M3, p: 3, g: M3, r: qa }
      - { t: Live, m: M4, p: 4, g: M4, r: be }
  - id: F-05
    title: "Pencarian & penyaringan berita"
    kind: feature
    prio: M
    epic: berita
    ref: "SKPL-F-05 · SKPL 3.2.4.2.4"
    story: "Sebagai pengunjung, saya ingin mencari berita dengan kata kunci dan memfilter kategori agar cepat menemukan berita yang saya mau."
    notes: "UI: daftar & detail berita, search bar, filter kategori. Live: query judul/isi + kategori hanya untuk artikel Published, dengan indeks DB (risiko Low di Charter)."
    ac:
      - "Kata kunci, filter kategori, atau keduanya bisa dipakai bersamaan"
      - "Tidak ada hasil → \"Artikel tidak ditemukan\""
      - "Hanya artikel Published yang muncul di publik"
    slices:
      - { t: UI, m: M3, p: 3, g: M3, r: qa }
      - { t: Live, m: M6, p: 3, g: M6, r: pm }
  - id: F-06
    title: "Pengelolaan katalog produk mitra (Admin Produk)"
    kind: feature
    prio: M
    epic: produk
    ref: "SKPL-F-06 · SKPL 3.2.4.2.6"
    story: "Sebagai Admin Produk, saya ingin mengelola katalog merchandise dan paket foto studio agar informasi produk selalu terbaru."
    ac:
      - "Tambah, ubah, dan arsipkan produk (jenis Merchandise / Foto Studio)"
      - "Paket foto: Indoor, Outdoor, Photobooth"
      - "Produk berstatus Diarsipkan tidak tampil di publik"
    slices:
      - { t: UI, m: M3, p: 3, g: M3, r: pm }
      - { t: Live, m: M5, p: 3, g: M5, r: fe }
  - id: F-07
    title: "Pemesanan produk & reservasi jadwal foto studio"
    kind: feature
    prio: M
    epic: produk
    ref: "SKPL-F-07 · SKPL 3.2.4.2.5"
    story: "Sebagai pengunjung, saya ingin memesan merchandise atau memilih paket dan slot foto studio agar bisa memesan tanpa menghubungi admin."
    notes: "UI: katalog publik + form pemesanan (dummy). Live: validasi, simpan pesanan berstatus MENUNGGU_PEMBAYARAN, pengecekan slot."
    ac:
      - "Form: nama, alamat, nomor telepon, email; field kosong → pesan galat"
      - "Foto studio wajib pilih paket dan slot hari & jam"
      - "Slot yang sudah terisi tidak bisa dipesan ulang"
    slices:
      - { t: UI, m: M3, p: 5, g: M3, r: qa }
      - { t: Live, m: M5, p: 5, g: M5, r: pm }
  - id: F-08
    title: "Pembayaran digital via DOKU (Checkout)"
    kind: feature
    prio: M
    epic: produk
    ref: "SKPL-F-08 · Charter Milestone 5"
    story: "Sebagai pengunjung, saya ingin membayar lewat halaman pembayaran DOKU tanpa mengunggah bukti transfer."
    notes: "UI: halaman ringkasan pesanan & status pembayaran. Live: panggil API Checkout DOKU (sandbox), redirect ke halaman bayar. Tidak ada QRIS statis dan tidak ada unggah bukti transfer."
    ac:
      - "Pesanan valid menghasilkan link/halaman pembayaran DOKU"
      - "Kredensial DOKU hanya di server (environment variable)"
      - "Pembayaran gagal → status PEMBAYARAN_GAGAL dan pesan ke pengunjung"
    slices:
      - { t: UI, m: M3, p: 2, g: M3, r: qa }
      - { t: Live, m: M5, p: 4, g: M5, r: be }
  - id: F-09a
    title: "Verifikasi pembayaran otomatis (webhook DOKU)"
    kind: feature
    prio: M
    epic: produk
    ref: "SKPL-F-09 · SKPL 3.1.3 · Charter Milestone 5"
    story: "Sebagai Admin Produk, saya ingin pesanan terverifikasi lunas otomatis agar tidak perlu mengecek bukti bayar manual."
    ac:
      - "Endpoint webhook memverifikasi tanda tangan notifikasi DOKU"
      - "Pembayaran sukses → payment_status PAID dan status MENUNGGU_KONFIRMASI"
      - "Notifikasi ganda tidak mengubah data dua kali (idempoten)"
      - "transaction_id dan payment_status tersimpan untuk audit"
    slices:
