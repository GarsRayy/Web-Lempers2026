name: Setup backlog

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (tidak mengubah apa pun)"
        type: boolean
        default: true
      only:
        description: "Opsional: labels,milestones,issues,project,assign (kosong = semua kecuali assign)"
        type: string
        default: ""

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api user --jq '"Login sebagai: " + .login'
          gh auth status || true

      - name: Jalankan skrip
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          INPUT_DRY: ${{ inputs.dry_run }}
          INPUT_ONLY: ${{ inputs.only }}
        run: |
          chmod +x setup-github.sh
          args=()
          if [ "$INPUT_DRY" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$INPUT_ONLY" ]; then args+=(--only "$INPUT_ONLY"); fi
          ./setup-github.sh "${args[@]}"
